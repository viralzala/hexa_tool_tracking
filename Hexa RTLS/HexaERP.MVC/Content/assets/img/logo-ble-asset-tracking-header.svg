<svg xmlns="http://www.w3.org/2000/svg" width="320" height="70" viewBox="0 0 320 70">
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6FE0"/>
      <stop offset="1" stop-color="#0B3C8C"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3C8C"/>
      <stop offset="1" stop-color="#06245A"/>
    </linearGradient>
  </defs>

  <!-- Icon group: ~48px tall, vertically centered (y offset = (70-48)/2 = 11) -->
  <g transform="translate(6,11)">
    <!-- BLE / wireless signal arcs -->
    <g fill="none" stroke="url(#gBlue)" stroke-width="5" stroke-linecap="round">
      <path d="M -20 -6 A 20 20 0 0 1 20 -6" opacity="0.35"/>
      <path d="M -13 -6 A 13 13 0 0 1 13 -6" opacity="0.6"/>
      <path d="M -6 -6 A 6 6 0 0 1 6 -6"/>
    </g>
    <!-- IoT hub -->
    <rect x="-13" y="-19" width="26" height="26" rx="6" fill="url(#gDark)"/>
    <circle cx="0" cy="-6" r="4" fill="#5AA0FF"/>
    <!-- location pin -->
    <path d="M 14 6 C 6 -2 6 -8 14 -8 C 22 -8 22 -2 14 6 Z" fill="url(#gBlue)"/>
    <circle cx="14" cy="-3" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark: vertically centered with icon -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700" text-anchor="start">
    <text x="64" y="32" font-size="20" fill="#0B3C8C" letter-spacing="1">BLE ASSET</text>
    <text x="64" y="54" font-size="20" fill="#1E6FE0" letter-spacing="1">TRACKING SYSTEM</text>
  </g>
</svg>
